# Optional: not a required check.
name: tests (optional)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: tests (optional)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: pq
        uses: peachq-org/setup-peachq@v1.0.0
        with:
          version: 0.92.20261116
      - shell: bash
        run: |
          sudo install -d -o "$USER" /home/claude
          sed -i '/test_kalman_schwartz_smith_roundtrip.q/d' tests/run_all_tests.q
          sed -i '/test_strategy_hedge_helper_shared.q/d' tests/run_all_tests.q
          $QCMD tests/run_all_tests.q -classic < /dev/null | tee out.txt
          echo "**peachq ${{ steps.pq.outputs.version }}:** $(grep -m1 ' Results:' out.txt)" >> "$GITHUB_STEP_SUMMARY"
